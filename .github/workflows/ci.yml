name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check Python syntax
        run: |
          python -m py_compile app/app.py
          python -m py_compile src/data_prep.py
          python -m py_compile src/train.py
          python -m py_compile src/compare_models.py
          python -m py_compile src/deploy_space.py

name: Train and deploy tourism predictor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare and publish dataset splits
        run: python src/data_prep.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Keep processed data for the training job
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/
          if-no-files-found: error
          retention-days: 1

  train:
    needs: prepare-data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed/
      - name: Train and upload model
        run: python src/train.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Keep model artifacts for deployment
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deployment dependency
        run: pip install "huggingface_hub>=0.23,<2"
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/
      - name: Update the Hugging Face Space
        run: python src/deploy_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
